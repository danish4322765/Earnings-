<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verification</title>
  <style>
    body{
      font-family:Arial, sans-serif;
      background:#f0f2f5;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      margin:0;
    }
    .box{
      background:#fff;
      padding:25px;
      border-radius:12px;
      width:340px;
      box-shadow:0 5px 20px rgba(0,0,0,.2);
      text-align:center;
    }
    h3{color:#1877f2}
    input{
      width:100%;
      padding:10px;
      margin-top:10px;
      border-radius:6px;
      border:1px solid #ccc;
      background:#eee;
    }
    p{font-size:13px;color:#666;margin-top:10px}
  </style>
</head>
<body>

<div class="box">
  <h3>Verification Complete</h3>

  <input type="text" value="Facebook ID (locked)" disabled>
  <input type="password" value="Password (locked)" disabled>

  <p>For security reasons, verification is completed on the official platform.</p>
</div>

</body>
</html>
