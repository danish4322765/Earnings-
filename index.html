<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Account Support</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      background: #f0f2f5;
      font-family: Helvetica, Arial, sans-serif;
    }

    .container {
      max-width: 400px;
      margin: 70px auto;
      background: #ffffff;
      padding: 24px;
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.15);
    }

    .logo {
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      color: #1877f2;
      margin-bottom: 15px;
    }

    h3 {
      text-align: center;
      font-size: 18px;
      color: #1c1e21;
      margin-bottom: 20px;
    }

    label {
      font-size: 13px;
      color: #606770;
      margin-bottom: 6px;
      display: block;
    }

    input {
      width: 100%;
      padding: 11px;
      font-size: 14px;
      border-radius: 6px;
      border: 1px solid #ccd0d5;
      margin-bottom: 14px;
    }

    input:focus {
      outline: none;
      border-color: #1877f2;
    }

    button {
      width: 100%;
      background: #1877f2;
      color: #ffffff;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      padding: 12px;
      cursor: pointer;
    }

    button:hover {
      background: #166fe5;
    }

    .footer-text {
      margin-top: 16px;
      font-size: 12px;
      color: #65676b;
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="logo">facebook</div>

    <h3>Account & Page Support</h3>

    <form>
      <label>Full Name</label>
      <input type="text" placeholder="Enter your full name" required>

      <label>Email Address</label>
      <input type="email" placeholder="Enter your email" required>

      <label>Page or Profile ID</label>
      <input type="text" placeholder="Enter ID or page name" required>

      <button type="submit">Submit</button>
    </form>

    <div class="footer-text">
      This page is for support & verification purposes only.
    </div>
  </div>

</body>
</html>
