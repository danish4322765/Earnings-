<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Facebook Page Alert</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .alert-box {
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
      text-align: center;
    }
    .alert-box h1 {
      color: #1877f2;
    }
    .alert-box p {
      margin-top: 15px;
      font-size: 16px;
    }
    .button {
      margin-top: 20px;
      padding: 10px 20px;
      background: #1877f2;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="alert-box">
    <h1>Your Facebook Page Earnings Are at Risk</h1>
    <p>Immediate action is required to secure your page bonuses.</p>
    <button class="button">Review Now</button>
  </div>
</body>
</html>
