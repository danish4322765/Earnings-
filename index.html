<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Please Wait</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Google AdSense -->
  <script async
    src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXX"
    crossorigin="anonymous"></script>

  <style>
    body{
      margin:0;
      font-family: system-ui, Arial, sans-serif;
      background:#f0f2f5;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }
    .card{
      background:#fff;
      width:100%;
      max-width:380px;
      padding:18px;
      border-radius:14px;
      box-shadow:0 6px 18px rgba(0,0,0,.15);
      text-align:center;
    }
    .title{
      font-size:16px;
      margin-bottom:10px;
      color:#333;
    }
    .timer{
      margin-top:12px;
      font-size:14px;
      color:#666;
    }
    .skip{
      margin-top:14px;
      width:100%;
      padding:12px;
      font-size:16px;
      border:none;
      border-radius:8px;
      background:#ccc;
      color:#666;
      cursor:not-allowed;
    }
    .skip.active{
      background:#1877f2;
      color:#fff;
      cursor:pointer;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="title">Advertisement</div>

  <!-- REAL AD -->
  <ins class="adsbygoogle"
       style="display:block"
       data-ad-client="ca-pub-XXXXXXXXXXXX"
       data-ad-slot="1234567890"
       data-ad-format="auto"
       data-full-width-responsive="true"></ins>

  <script>
    (adsbygoogle = window.adsbygoogle || []).push({});
  </script>

  <div class="timer">
    Skip available in <span id="sec">5</span> seconds
  </div>

  <button id="skipBtn" class="skip" disabled>Skip Ad</button>
</div>

<script>
  let s = 5;
  const sec = document.getElementById("sec");
  const btn = document.getElementById("skipBtn");

  const timer = setInterval(() => {
    s--;
    sec.textContent = s;
    if (s === 0) {
      clearInterval(timer);
      btn.disabled = false;
      btn.classList.add("active");
      btn.textContent = "Continue";
      btn.onclick = () => {
        window.location.href = "https://your-link-here.com";
      };
    }
  }, 1000);
</script>

</body>
</html>
