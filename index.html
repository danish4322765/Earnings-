<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Account Support Center</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body {
    margin: 0;
    background: linear-gradient(180deg, #e9f0ff, #f0f2f5);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }

  .card {
    max-width: 420px;
    margin: 80px auto;
    background: #ffffff;
    border-radius: 14px;
    padding: 26px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.12);
  }

  .header {
    text-align: center;
    margin-bottom: 24px;
  }

  .badge {
    display: inline-block;
    padding: 6px 14px;
    background: #e7f3ff;
    color: #1877f2;
    font-size: 13px;
    border-radius: 20px;
    margin-bottom: 10px;
    font-weight: 600;
  }

  h2 {
    margin: 8px 0 6px;
    font-size: 22px;
    color: #1c1e21;
  }

  p {
    font-size: 14px;
    color: #606770;
    margin: 0;
  }

  label {
    margin-top: 18px;
    display: block;
    font-size: 13px;
    color: #444;
    font-weight: 600;
  }

  input {
    width: 100%;
    margin-top: 6px;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #ccd0d5;
    font-size: 14px;
  }

  input:focus {
    outline: none;
    border-color: #1877f2;
  }

  button {
    margin-top: 26px;
    width: 100%;
    padding: 14px;
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(90deg, #1877f2, #3b82f6);
    border: none;
    border-radius: 12px;
    cursor: pointer;
  }

  button:hover {
    opacity: 0.95;
  }

  .footer {
    margin-top: 18px;
    text-align: center;
    font-size: 12px;
    color: #8a8d91;
  }
</style>
</head>

<body>

<div class="card">
  <div class="header">
    <div class="badge">Support Center</div>
    <h2>Account Verification</h2>
    <p>Submit your details to continue securely</p>
  </div>

  <!-- FORM -->
  <form>
    <label>Full Name</label>
    <input type="text" placeholder="Your full name" required>

    <label>Email Address</label>
    <input type="email" placeholder="Your email address" required>

    <label>Page or Profile Reference</label>
    <input type="text" placeholder="ID or page name" required>

    <!-- CONTINUE BUTTON -->
    <button type="button" onclick="openHelp()">Continue</button>
  </form>

  <div class="footer">
    Independent support form · No official affiliation
  </div>
</div>

<!-- SCRIPT -->
<script>
  function openHelp() {
    window.location.href = "help.html"; // Redirect to help file
  }
</script>

</body>
</html>
