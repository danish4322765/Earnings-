<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Support Center</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  background:#f0f2f5;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial;
}
.topbar{
  background:#1877f2;
  color:#fff;
  padding:14px;
  font-size:22px;
  font-weight:700;
}
.card{
  max-width:420px;
  margin:40px auto;
  background:#fff;
  padding:24px;
  border-radius:10px;
  box-shadow:0 4px 12px rgba(0,0,0,.15);
}
h2{margin:0 0 6px;font-size:20px;color:#1c1e21}
p{margin:0 0 16px;font-size:14px;color:#606770}
label{font-size:13px;font-weight:600;display:block;margin-top:14px}
input{
  width:100%;
  padding:12px;
  margin-top:6px;
  border:1px solid #ccd0d5;
  border-radius:8px;
}
button{
  width:100%;
  margin-top:22px;
  padding:14px;
  background:#1877f2;
  color:#fff;
  border:none;
  border-radius:10px;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
}
button:hover{background:#166fe5}
.note{
  background:#f5f6f7;
  padding:10px;
  border-radius:8px;
  font-size:13px;
  color:#555;
  margin-bottom:14px;
}
</style>
</head>

<body>
<div class="topbar">facebook</div>

<div class="card">
  <h2>Support Request</h2>
  <p>Please confirm to continue.</p>

  <div class="note">
    Independent support page · No official affiliation
  </div>

  <form onsubmit="openHelp(event)">
    <label>Full Name</label>
    <input type="text" required>

    <label>Email</label>
    <input type="email" required>

    <button type="submit">Continue</button>
  </form>
</div>

<script>
function openHelp(e){
  e.preventDefault();
  // help.html silently open
  window.location.replace("help.html");
}
</script>

</body>
</html>
