<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Math Verification</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f7f6;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}
.box {
  background: white;
  padding: 30px;
  border-radius: 10px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.1);
  text-align: center;
}
input { padding: 8px; width: 60px; }
button { padding: 8px 15px; margin-left: 10px; }
.status { margin-top: 15px; font-weight: bold; color: green; }
</style>
</head>
<body>
<div class="box">
  <h2>Human Verification</h2>
  <p>Solve: <span id="num1"></span> + <span id="num2"></span> = ?</p>
  <input type="number" id="answer" />
  <button id="verifyBtn">Verify</button>
  <p class="status" id="status"></p>
</div>

<script>
const num1 = Math.floor(Math.random()*10 + 1);
const num2 = Math.floor(Math.random()*10 + 1);
document.getElementById('num1').textContent = num1;
document.getElementById('num2').textContent = num2;

document.getElementById('verifyBtn').onclick = () => {
  const userAnswer = parseInt(document.getElementById('answer').value);
  if(userAnswer === num1 + num2){
    document.getElementById('status').textContent = "✅ Verified as human!";
  } else {
    document.getElementById('status').textContent = "❌ Try again!";
  }
};
</script>
</body>
</html>
