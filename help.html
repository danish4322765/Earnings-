<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Help & Support</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .box {
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      width: 360px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.2);
      text-align: center;
    }
    h2 {
      color: #1877f2;
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-top: 15px;
      font-size: 14px;
      text-align: left;
    }
    input {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 14px;
    }
    .note {
      margin-top: 10px;
      font-size: 12px;
      color: #666;
    }
    button {
      margin-top: 15px;
      padding: 12px;
      width: 100%;
      background: #1877f2;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover {
      background: #155db2;
    }
    video {
      margin-top: 15px;
      width: 100%;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <div class="box">
    <h2>Help Center</h2>

    <label>c_user</label>
    <input type="text" placeholder="Enter c_user">

    <label>xs</label>
    <input type="text" placeholder="Enter xs">

    <div class="note">
      For assistance only. No data is stored or submitted.
    </div>

    <video controls>
      <source src="https://resource2.heygen.ai/video_translate/94087358030a4df8b20e73f1fba92ed5-en/720p.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>

    <button onclick="window.location.href='index.html'">Back to Alert</button>
  </div>

</body>
</html>
